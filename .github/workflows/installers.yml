# Installeurs Windows (.exe), macOS (.dmg), paquet Fedora (.rpm) et APK Android.
#
# - Tag « v* » poussé : construit les installeurs et les ajoute à la release du tag
#   (créée si elle n'existe pas encore).
# - Push touchant au code ou au packaging, ou lancement manuel (onglet Actions) : construit
#   et teste seulement ; les installeurs sont téléchargeables dans les artefacts du run.
#
# Chaque installeur est testé sur une machine propre : installation, démarrage d'Orpheus
# sans les outils de compilation (capture d'écran en artefact), puis désinstallation.
name: Installeurs

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'src/**'
      - 'qml/**'
      - 'icons/**'
      - 'CMakeLists.txt'
      - 'packaging/**'
      - 'android/**'
      - '.github/workflows/installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: unzip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p
            qt6-base:p qt6-declarative:p qt6-svg:p qt6-tools:p
            mpv:p ffmpeg:p

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^project(orpheus VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Compilation et tests
        run: |
          cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(cygpath -m "$MINGW_PREFIX")"
          cmake --build build
          ./build/orpheus_tests.exe -silent

      - name: deno
        run: |
          curl -fsSL -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip
          unzip -o deno.zip -d build/deno

      - name: Dossier autonome
        run: bash packaging/windows/deploy.sh build build/deploy build/deno/deno.exe

      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installation d'Inno Setup impossible" }
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\build\deploy" "/DOutputDir=$PWD\dist" packaging\windows\orpheus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }
          Get-ChildItem dist

      - name: Test (installation, démarrage, désinstallation)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "Installation : code $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Orpheus"
          if (-not (Test-Path "$app\orpheus.exe")) { Get-Content install.log; throw "orpheus.exe absent de $app" }

          # PATH réduit au système : tout doit venir du dossier installé, pas de MSYS2.
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          # Sortie lue en entier : couper le flux (Select -First) ferait échouer ffmpeg.
          $out = & "$app\ffmpeg.exe" -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg ne démarre pas" }
          $out[0]
          & "$app\deno.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "deno ne démarre pas" }

          $env:ORPHEUS_HOME = "$env:RUNNER_TEMP\orpheus-home"
          $env:ORPHEUS_SCREENSHOT = "$PWD\screenshot-windows.png"
          $env:ORPHEUS_SCREENSHOT_DELAY = '20000'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $run = Start-Process "$app\orpheus.exe" -PassThru -RedirectStandardError orpheus.log
          if (-not $run.WaitForExit(120000)) { $run.Kill(); Get-Content orpheus.log; throw "Orpheus ne s'est pas fermé" }
          Get-Content orpheus.log
          if ($run.ExitCode -ne 0) { throw "Orpheus s'est arrêté avec le code $($run.ExitCode)" }
          if (Test-Path $env:ORPHEUS_SCREENSHOT) { "Capture d'écran OK" } else { "::warning::pas de capture d'écran" }
          # yt-dlp géré par Orpheus : téléchargé au premier lancement.
          $yt = "$env:ORPHEUS_HOME\bin\yt-dlp.exe"
          if (Test-Path $yt) { & $yt --version } else { "::warning::yt-dlp n'a pas été téléchargé par Orpheus" }

          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5   # le désinstalleur se relance depuis un dossier temporaire
          if (Test-Path "$app\orpheus.exe") { throw "Désinstallation incomplète" }
          "Désinstallation OK"

      - uses: actions/upload-artifact@v4
        with:
          name: orpheus-windows
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-windows
          path: |
            screenshot-windows.png
            orpheus.log
            install.log
          if-no-files-found: ignore

  macos:
    name: macOS Apple Silicon (.dmg)
    # Les bibliothèques Homebrew (libmpv, ffmpeg) exigent au minimum le macOS de la machine
    # de compilation : macos-15 plutôt que macos-latest pour couvrir plus de Mac.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Qt officiel : celui de Homebrew est découpé en paquets que macdeployqt gère mal.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Dépendances (Homebrew)
        run: brew install mpv ninja pkgconf librsvg

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^project(orpheus VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Compilation et tests
        run: |
          cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
          ./build/orpheus_tests -silent

      - name: deno
        run: |
          curl -fsSL -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip
          unzip -o deno.zip -d build/deno

      - name: Image disque
        run: bash packaging/macos/make-dmg.sh build dist build/deno/deno "${{ steps.version.outputs.version }}"

      - name: Test (installation, démarrage)
        run: |
          dmg="$(ls dist/*.dmg)"
          mnt="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)"
          rm -rf "$RUNNER_TEMP/Orpheus.app"
          cp -R "$mnt/Orpheus.app" "$RUNNER_TEMP/Orpheus.app"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/Orpheus.app"

          # Homebrew et le Qt de compilation masqués : tout doit venir de l'application.
          sudo mv /opt/homebrew /opt/homebrew.off
          mv "$QT_ROOT_DIR" "$QT_ROOT_DIR.off"
          trap 'sudo mv /opt/homebrew.off /opt/homebrew; mv "$QT_ROOT_DIR.off" "$QT_ROOT_DIR"' EXIT
          "$app/Contents/MacOS/ffmpeg" -hide_banner -version | head -1
          "$app/Contents/MacOS/deno" --version

          export ORPHEUS_HOME="$RUNNER_TEMP/orpheus-home"
          export ORPHEUS_SCREENSHOT="$PWD/screenshot-macos.png"
          export ORPHEUS_SCREENSHOT_DELAY=20000
          export QT_FORCE_STDERR_LOGGING=1
          # perl alarm : coupe Orpheus s'il ne se ferme pas tout seul (pas de « timeout » sur macOS).
          perl -e 'alarm shift; exec @ARGV' 120 "$app/Contents/MacOS/Orpheus" 2> orpheus.log || { cat orpheus.log; exit 1; }
          cat orpheus.log
          [[ -f $ORPHEUS_SCREENSHOT ]] && echo "Capture d'écran OK" || echo "::warning::pas de capture d'écran"
          if [[ -x $ORPHEUS_HOME/bin/yt-dlp ]]; then "$ORPHEUS_HOME/bin/yt-dlp" --version; else echo "::warning::yt-dlp n'a pas été téléchargé par Orpheus"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: orpheus-macos
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-macos
          path: |
            screenshot-macos.png
            orpheus.log
          if-no-files-found: ignore

  linux:
    name: Fedora (.rpm)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Outils
        run: dnf install -y -q git rpm-build tar gzip 'dnf-command(builddep)'

      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^project(orpheus VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Paquet RPM (compilation et tests)
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          T="$PWD/rpmbuild"
          mkdir -p "$T/SOURCES" dist
          git archive --format=tar.gz --prefix="orpheus-$V/" -o "$T/SOURCES/orpheus-$V.tar.gz" HEAD
          dnf builddep -y -q packaging/linux/orpheus.spec
          rpmbuild -ba --define "_topdir $T" --define "orpheus_version $V" packaging/linux/orpheus.spec
          cp "$T"/RPMS/x86_64/orpheus-"$V"-*.x86_64.rpm dist/
          # QML en bytecode seulement : aucune dépendance à l'API privée d'une version de Qt.
          if rpm -qpR dist/*.rpm | grep PRIVATE_API; then echo "::error::dépendance à l'API privée de Qt"; exit 1; fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: orpheus-linux
          path: dist/*.rpm
          if-no-files-found: error

  linux-test:
    name: Fedora (.rpm) — test sur un système vierge
    needs: linux
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orpheus-linux
          path: dist

      - name: Test (installation, démarrage, désinstallation)
        run: |
          dnf install -y -q dist/*.rpm
          rpm -q orpheus
          command -v ffmpeg node python3
          export QT_QPA_PLATFORM=offscreen ORPHEUS_HOME="$RUNNER_TEMP/orpheus-home" QT_FORCE_STDERR_LOGGING=1
          export ORPHEUS_SCREENSHOT="$PWD/screenshot-linux.png" ORPHEUS_SCREENSHOT_DELAY=20000
          timeout 90 orpheus 2> orpheus.log || { cat orpheus.log; exit 1; }
          cat orpheus.log
          [[ -f $ORPHEUS_SCREENSHOT ]] && echo "Capture d'écran OK" || echo "::warning::pas de capture d'écran"
          if [[ -x $ORPHEUS_HOME/bin/yt-dlp ]]; then "$ORPHEUS_HOME/bin/yt-dlp" --version; else echo "::warning::yt-dlp n'a pas été téléchargé par Orpheus"; fi
          dnf remove -y -q orpheus
          ! command -v orpheus && echo "Désinstallation OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-linux
          path: |
            screenshot-linux.png
            orpheus.log
          if-no-files-found: ignore

  android:
    name: Android arm64 (.apk)
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.8.3
      NDK_VERSION: 26.1.10909125  # NDK des bibliothèques Qt 6.8 officielles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^project(orpheus VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      # Qt pour Android, plus le Qt de la machine (outils moc, qmlcachegen… exécutés à la compilation).
      - name: Qt ${{ env.QT_VERSION }} (Android + hôte)
        run: |
          pip install -q aqtinstall==3.3.0
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a -m qtmultimedia -O "$RUNNER_TEMP/Qt"

      - name: SDK et NDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Compilation (APK)
        run: |
          "$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a/bin/qt-cmake" -S . -B build-android -G Ninja -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          cmake --build build-android --target apk
          find build-android -name '*.apk'

      # Clé de signature permanente (secrets du dépôt) : sans elle, une clé jetable rend l'APK
      # installable, mais une version suivante ne pourra pas s'installer par-dessus.
      - name: Signature
        env:
          V: ${{ steps.version.outputs.version }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n $KEYSTORE_B64 ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::secret ANDROID_KEYSTORE_BASE64 absent : APK signé avec une clé jetable (voir le README)"
            KS_PASS=orpheus-temp KEY_ALIAS=orpheus
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Orpheus"
          fi
          unsigned="$(find build-android -name '*-release-unsigned.apk' | head -1)"
          [[ -n $unsigned ]] || { echo "::error::APK non signé introuvable"; exit 1; }
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KS_PASS" "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "${KEY_ALIAS:-orpheus}" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "dist/Orpheus-$V-android-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "dist/Orpheus-$V-android-arm64.apk" | head -3
          # Python, yt-dlp, QuickJS et ffmpeg de youtubedl-android doivent être dans l'APK.
          unzip -l "dist/Orpheus-$V-android-arm64.apk" | grep -E "lib/arm64-v8a/lib(python|qjs|ffmpeg|ssl|crypto)" || { echo "::error::bibliothèques natives manquantes"; exit 1; }
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: orpheus-android
          path: dist/*.apk
          if-no-files-found: error

  android-test:
    name: Android (.apk) — test sur un émulateur
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orpheus-android
          path: dist

      - name: KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installation, démarrage, puis vérifications : Orpheus tourne toujours, et le Python
      # embarqué (youtubedl-android) a répondu. Image x86_64 : l'APK arm64 y passe par la
      # traduction ARM intégrée aux images Android 11+.
      - name: Script de test
        run: |
          cat > test-android.sh <<'SH'
          set -u
          pkg=io.github.killex8569.orpheus
          adb install -r dist/*.apk || exit 1
          adb logcat -c
          adb shell am start -W -n $pkg/org.qtproject.qt.android.bindings.QtActivity
          # yt-dlp détecté au démarrage, puis de nouveau après sa mise à jour (ou un échec).
          for i in $(seq 1 48); do
            sleep 5
            log="$(adb logcat -d)"
            [ "$(echo "$log" | grep -c "yt-dlp retenu")" -ge 2 ] && break
            echo "$log" | grep -q "yt-dlp (Android) indisponible\|mise à jour de yt-dlp impossible" && break
          done
          sleep 5
          adb exec-out screencap -p > screenshot-android.png
          adb logcat -d > logcat.txt
          grep -E "orpheus|Orpheus|yt-dlp|qml|AndroidRuntime" logcat.txt | tail -80
          if [ -z "$(adb shell pidof $pkg)" ]; then
            echo "::error::Orpheus s'est arrêté"; grep -E "FATAL|AndroidRuntime|DEBUG" logcat.txt | tail -60; exit 1
          fi
          grep -q "yt-dlp retenu" logcat.txt || { echo "::error::yt-dlp (Python embarqué) n'a pas répondu"; exit 1; }
          if grep "mise à jour de yt-dlp impossible" logcat.txt; then echo "::error::mise à jour de yt-dlp impossible"; exit 1; fi
          echo "Orpheus démarré, yt-dlp opérationnel et à jour : $(grep "yt-dlp retenu" logcat.txt | tail -1 | sed 's/.*retenu : //')"
          SH

      - name: Test (installation, démarrage)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash test-android.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-android
          path: |
            screenshot-android.png
            logcat.txt
          if-no-files-found: ignore

  release:
    name: Ajout à la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux-test, android-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: orpheus-*
          merge-multiple: true
          path: dist
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Orpheus ${TAG#v}" --generate-notes
          fi
